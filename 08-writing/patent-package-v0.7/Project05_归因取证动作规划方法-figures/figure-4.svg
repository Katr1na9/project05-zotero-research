<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="257" viewBox="0 0 2300 257" role="img" aria-label="图4 取证动作执行与停止降级闭环示意图">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="1150.0" y="28" text-anchor="middle" font-family="SimSun, Songti SC, serif" font-size="20">图4 取证动作执行与停止降级闭环示意图</text>
<line x1="430" y1="151.0" x2="520" y2="151.0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="483.0" y="143.0" font-family="SimSun, Songti SC, serif" font-size="16">开始</text>
<line x1="880" y1="151.0" x2="970" y2="151.0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="933.0" y="143.0" font-family="SimSun, Songti SC, serif" font-size="16">继续采集</text>
<line x1="1330" y1="151.0" x2="1420" y2="151.0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1383.0" y="143.0" font-family="SimSun, Songti SC, serif" font-size="16">新增证据或零收益</text>
<line x1="1780" y1="151.0" x2="520" y2="151.0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1158.0" y="143.0" font-family="SimSun, Songti SC, serif" font-size="16">未结束</text>
<line x1="880" y1="151.0" x2="1870" y2="151.0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1383.0" y="143.0" font-family="SimSun, Songti SC, serif" font-size="16">目标达成、预算不足或不可达</text>
<rect x="70" y="115" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="250.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">当前证据缺口状态及剩余预算</text>
<rect x="520" y="115" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="700.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">选择目标取证动作</text>
<rect x="970" y="115" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1150.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">执行采集通道</text>
<rect x="1420" y="115" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1600.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">更新状态及剩余预算</text>
<rect x="1870" y="115" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="2050.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">输出当前可支撑归因粒度及停止原因</text>
</svg>