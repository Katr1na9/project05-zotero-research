<path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="1150.0" y="28" text-anchor="middle" font-family="SimSun, Songti SC, serif" font-size="20">图5 具有先决依赖的多步取证动作规划示意图</text>
