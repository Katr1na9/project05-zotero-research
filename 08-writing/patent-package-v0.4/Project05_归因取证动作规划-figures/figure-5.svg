<text x="1383.0" y="143.0" font-family="SimSun, Songti SC, serif" font-size="16">达标</text>
<line x1="430" y1="151.0" x2="1870" y2="151.0" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
