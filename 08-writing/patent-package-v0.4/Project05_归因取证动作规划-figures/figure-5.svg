<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="257" viewBox="0 0 2300 257" role="img" aria-label="图5 具有先决依赖的多步取证动作规划示意图">
<defs>
