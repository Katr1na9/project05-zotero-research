<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">From invalid packet-null labels to pointer-bounded candidate verification</title>
  <desc id="desc">Benign provenance logs contain valid process, file, and network observations and cannot be empty compiler packets. Security information extraction negatives are relative to their own target ontology. The recommended Project05 amendment creates positive and controlled unsupported candidate edges from the same approved source records, asks Qwen to normalize and verify them, admits only pointer-supported edges, and passes the graph to M3.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
    <pattern id="reject" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FCE8DF"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#D55E00" stroke-width="3"/>
    </pattern>
    <style>
      .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #111111; }
      .head { font: 700 20px Arial, Helvetica, sans-serif; fill: #111111; }
      .body { font: 16px Arial, Helvetica, sans-serif; fill: #111111; }
      .small { font: 14px Arial, Helvetica, sans-serif; fill: #222222; }
      .box { stroke: #222222; stroke-width: 2.2; rx: 18; ry: 18; }
      .arrow { stroke: #222222; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 10 8; }
      .tag { font: 700 15px Arial, Helvetica, sans-serif; fill: #111111; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#FFFFFF"/>
  <text x="700" y="46" text-anchor="middle" class="title">Training-negative unit: packet absence vs. pointer-bounded support</text>

  <rect class="box" x="45" y="90" width="390" height="245" fill="#DCEFFA"/>
  <text x="240" y="128" text-anchor="middle" class="head">Benign / normal security logs</text>
  <text x="70" y="168" class="body">• ProvSec benign runtime: 341.7K events</text>
  <text x="70" y="201" class="body">• BETH benign rows: process/network fields</text>
  <text x="70" y="234" class="body">• LID-DS normal traces: many syscalls</text>
  <text x="70" y="274" class="small">Attack status = benign; observation graph ≠ empty</text>
  <rect class="box" x="102" y="292" width="276" height="64" fill="url(#reject)"/>
  <text x="240" y="320" text-anchor="middle" class="tag">REJECT as packet-null</text>
  <text x="240" y="343" text-anchor="middle" class="small">would erase real SPO edges</text>

  <rect class="box" x="505" y="90" width="390" height="245" fill="#FFF2CC"/>
  <text x="700" y="128" text-anchor="middle" class="head">Security IE / NLI negatives</text>
  <text x="530" y="168" class="body">• non-trigger token / no target event</text>
  <text x="530" y="201" class="body">• no-relation under a fixed ontology</text>
  <text x="530" y="234" class="body">• hypothesis not mentioned by document</text>
  <text x="530" y="274" class="small">Valid only relative to candidate / target ontology</text>
  <rect class="box" x="562" y="292" width="276" height="64" fill="#E7E1F2"/>
  <text x="700" y="320" text-anchor="middle" class="tag">METHOD PRECEDENT</text>
  <text x="700" y="343" text-anchor="middle" class="small">requires explicit task amendment</text>

  <rect class="box" x="965" y="90" width="390" height="245" fill="#D9F0E3"/>
  <text x="1160" y="128" text-anchor="middle" class="head">Approved Project05 records</text>
  <text x="990" y="168" class="body">• same source families and modality</text>
  <text x="990" y="201" class="body">• explicit fields + exact pointer + hash</text>
  <text x="990" y="234" class="body">• G0-mappable SPO/time only</text>
  <text x="990" y="274" class="small">No path, actor, TTP or model-created truth</text>
  <rect class="box" x="1022" y="292" width="276" height="64" fill="#C7E9C0"/>
  <text x="1160" y="320" text-anchor="middle" class="tag">DRAFT AMENDMENT</text>
  <text x="1160" y="343" text-anchor="middle" class="small">candidate support, not world absence</text>

  <path class="arrow dash" d="M1160,356 L1160,402 L230,402 L230,452"/>

  <text x="700" y="438" text-anchor="middle" class="head">Recommended source-grounded semantic graph pipeline</text>

  <rect class="box" x="35" y="472" width="235" height="158" fill="#DCEFFA"/>
  <text x="152" y="507" text-anchor="middle" class="head">1. G0 proposal</text>
  <text x="58" y="544" class="body">Explicit entities, fields,</text>
  <text x="58" y="573" class="body">time and source pointer</text>
  <text x="58" y="607" class="small">high recall; no semantics guessed</text>

  <path class="arrow" d="M270,551 L316,551"/>

  <rect class="box" x="320" y="472" width="260" height="158" fill="#F0E6F6"/>
  <text x="450" y="507" text-anchor="middle" class="head">2. Pair construction</text>
  <text x="343" y="544" class="body">supported candidate</text>
  <text x="343" y="573" class="body">+ pointer-bounded negative</text>
  <text x="343" y="607" class="small">N1/N2/N3/N4 proof object</text>

  <path class="arrow" d="M580,551 L626,551"/>

  <rect class="box" x="630" y="472" width="235" height="158" fill="#FFF2CC"/>
  <text x="747" y="507" text-anchor="middle" class="head">3. Qwen layer</text>
  <text x="653" y="544" class="body">semantic normalization</text>
  <text x="653" y="573" class="body">+ support decision</text>
  <text x="653" y="607" class="small">General vs QLoRA paired</text>

  <path class="arrow" d="M865,551 L911,551"/>

  <rect class="box" x="915" y="472" width="225" height="158" fill="#D9F0E3"/>
  <text x="1027" y="507" text-anchor="middle" class="head">4. G0 admission</text>
  <text x="938" y="544" class="body">schema / hash / pointer</text>
  <text x="938" y="573" class="body">supported edge only</text>
  <text x="938" y="607" class="small">unsupported → abstain</text>

  <path class="arrow" d="M1140,551 L1186,551"/>

  <rect class="box" x="1190" y="472" width="175" height="158" fill="#C7E9C0"/>
  <text x="1277" y="507" text-anchor="middle" class="head">5. Mainline</text>
  <text x="1215" y="544" class="body">executable graph</text>
  <text x="1215" y="573" class="body">→ M3 controller</text>
  <text x="1215" y="607" class="small">trace + cost plan</text>

  <rect class="box" x="145" y="690" width="1110" height="108" fill="#F5F5F5"/>
  <text x="700" y="726" text-anchor="middle" class="head">Meaning of a negative label</text>
  <text x="700" y="758" text-anchor="middle" class="body">“This exact source pointer does not support this candidate SPO/time.”</text>
  <text x="700" y="786" text-anchor="middle" class="small">Not: benign host · no attack · event absent from the world · whole packet has no observation</text>

  <text x="700" y="838" text-anchor="middle" class="small">Blue = source/proposal · purple/yellow = semantic pairing/model · green = admitted mainline output · hatching = rejected label construction</text>
</svg>
