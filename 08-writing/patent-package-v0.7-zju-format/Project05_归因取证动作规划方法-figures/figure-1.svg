<text x="250.0" y="144.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">S1：获取攻击行为图及本地安全证据声</text>
<text x="250.0" y="168.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">明</text>
